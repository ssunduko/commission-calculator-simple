/**
 * Protocol Buffer definitions for the User Service.
 *
 * This file defines the gRPC service interface and message types for managing
 * users in the commission calculator system.
 */

syntax = "proto3";

package commission;

import "commission_common.proto";

option java_package = "com.chapman.edu.commissions.api.grpc.proto";
option java_multiple_files = true;
option java_outer_classname = "UserServiceProto";

/**
 * User represents a system user.
 *
 * Users can be sales representatives, managers, finance administrators, or system administrators.
 * This message corresponds to the User Java class.
 *
 * Note: passwordHash is excluded from the proto definition for security reasons.
 * Password handling should be done through separate authentication mechanisms.
 */
message User {
    string id = 1;                      // Unique identifier (e.g., "USER-001")
    string username = 2;                // Login username (unique)
    string email = 3;                   // Email address
    string first_name = 4;              // First name
    string last_name = 5;               // Last name
    repeated UserRole roles = 6;        // List of assigned roles (repeated = Set in Java)
    bool active = 7;                    // Whether user account is active
    Timestamp last_login = 8;           // Last login timestamp (optional)
    Date created_date = 9;              // Account creation date
    string created_by = 10;             // ID of user who created this account
    string manager_id = 11;             // ID of user's manager (optional)
    string department = 12;             // Department name
    string territory = 13;              // Sales territory
}

/**
 * Request message for creating a new user.
 *
 * Password should be handled separately through authentication flow.
 */
message CreateUserRequest {
    string username = 1;
    string email = 2;
    string first_name = 3;
    string last_name = 4;
    repeated UserRole roles = 5;
    string department = 6;
    string territory = 7;
    string manager_id = 8;
}

/**
 * Response message containing a created user.
 */
message CreateUserResponse {
    User user = 1;  // The newly created user with generated ID
}

/**
 * Request message for retrieving a specific user by ID.
 */
message GetUserRequest {
    string id = 1;  // The user ID to retrieve
}

/**
 * Response message containing a single user.
 */
message GetUserResponse {
    User user = 1;  // The requested user
}

/**
 * Request message for listing all users with optional filters.
 *
 * Supports filtering by role and active status.
 */
message ListUsersRequest {
    UserRole role_filter = 1;  // Optional: Filter by role
    bool active_only = 2;      // Optional: Only return active users (default: false)
}

/**
 * Response message containing a list of users.
 */
message ListUsersResponse {
    repeated User users = 1;  // List of matching users
    int32 total_count = 2;    // Total number of users
}

/**
 * Request message for updating an existing user.
 */
message UpdateUserRequest {
    User user = 1;  // The user with updated values
}

/**
 * Response message containing the updated user.
 */
message UpdateUserResponse {
    User user = 1;  // The updated user as saved in the system
}

/**
 * Request message for deleting a user.
 */
message DeleteUserRequest {
    string id = 1;  // ID of the user to delete
}

/**
 * Response message for delete operation.
 */
message DeleteUserResponse {
    bool success = 1;      // Whether deletion was successful
    string message = 2;    // Optional message
}

/**
 * UserService defines the gRPC service interface for user management.
 *
 * This service provides CRUD operations for users and demonstrates
 * the same patterns as DealService but for a different domain entity.
 *
 * Key Concepts Demonstrated:
 * - Service definition pattern (consistent with DealService)
 * - User roles and permissions modeling
 * - Optional field handling in proto3
 * - Repeated fields for collections (roles)
 */
service UserService {
    /**
     * Create a new user.
     *
     * Analogous to: POST /api/v1/users
     */
    rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

    /**
     * Retrieve a specific user by ID.
     *
     * Analogous to: GET /api/v1/users/{id}
     */
    rpc GetUser(GetUserRequest) returns (GetUserResponse);

    /**
     * List all users with optional filtering.
     *
     * Analogous to: GET /api/v1/users?role=SALES_REP&activeOnly=true
     */
    rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

    /**
     * Update an existing user.
     *
     * Analogous to: PUT /api/v1/users/{id}
     */
    rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);

    /**
     * Delete a user by ID.
     *
     * Analogous to: DELETE /api/v1/users/{id}
     */
    rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}